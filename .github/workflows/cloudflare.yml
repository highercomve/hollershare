name: Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'zine.ziggy', '.github/workflows/cloudflare.yml', 'scripts/site-for-cloudflare.sh', 'scripts/sync-privacy.py', 'frontend/index.html']
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false
env:
  PROJECT: hollershare
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      # Must run before the rewrite below, which changes the policy URL in privacy.smd.
      - name: Check offline privacy policy
        run: python3 scripts/sync-privacy.py --check
      - name: Install Zine 0.14.0
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/zine.tar.xz" https://github.com/kristoff-it/zine/releases/download/v0.14.0/x86_64-linux-musl.tar.xz
          tar xJf "$RUNNER_TEMP/zine.tar.xz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/zine"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Serve from hollershare.foreachdeveloper.com
        run: scripts/site-for-cloudflare.sh hollershare hollershare
      - run: zine release
      - name: Skip without Cloudflare credentials
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping deploy."
      # The Pages project is created on the first deploy if it doesn't exist.
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true
